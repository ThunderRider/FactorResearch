# ================================================================
# 字段 schema
# ================================================================
# id            唯一标识，必须与 features 面板里的列名完全一致
# label         中文名
# family        量价 / 反转 / 波动 / 流动性 / 日内结构 / 事件 / 择时 / 规模代理
# layer         可选：selection（选股）/ position（仓位）/ selection_switch（择线）
# status        draft | candidate | active | watch | retired | rejected | input | control
# direction     positive | negative | none（方向：值越大越好 / 越小越好 / 无关）
# definition    精确定义，可直接翻译成代码
# formula_code  实现位置（模块.函数）
# params        参数（改参数 = 一次新试验，必须记账）
# pit_fields    用到的字段，必须都出现在 field_pit.yaml 里
# labels        适用的标签（见 labels.yaml）
# independent   true | false | partial | unknown（正交化后的判定）
# evidence      证据（数字 + 口径），结果文件的路径写进 source_run
# reject_reason status=rejected 时必填
# retire_if     status=active 时必填（退役条件）
# source_run    artifacts/results/ 下的 run_id
# source_doc    对应知识文档（相对路径）
# status_changed / status_reason  状态变更记录

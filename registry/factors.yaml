  - id: gtja_168
    label: 异常缩量（日频量比）
    family: 量价
    status: watch
    direction: positive
    definition: "-1 * volume / rolling_mean(volume, 20)，日线，再 shift(1)"
    formula_code: "research/2026-11_gtja191_first_batch/build_extra.py::g168"
    params: {window: 20, lag: 1}
    pit_fields: [volume]
    labels: [ret_1445_next_1115]
    independent: true
    notes: |
      与 vol_ratio 同族但不同口径：vol_ratio 用 14:30 那根 bar（同时点分母，去掉日内季节性），
      gtja_168 用 T−1 全天量。二者秩相关 −0.473，**未到 0.7 的马甲线**。
      只过了门 3 / 门 4，门 5 / 门 6 未做。
    evidence:
      min_pool: {mean_ic: 0.0454, t_newey_west: 8.56, retention: 0.86, resid_t: 10.84}
      mac_pool: {mean_ic: 0.0155, t_newey_west: 3.56, retention: 1.09, resid_t: 5.14}
      correlation: {vol_ratio: -0.473, ret_20d: -0.301, vol_20d: 0.075, amihud_lag: -0.064}
    source_run: "20261126-gtja191-batch2"
    source_doc: "research/2026-11_gtja191_first_batch/conclusion.md"
    retire_if:
      - "连续 2 个季度 min 池 IC < 0.022"
      - "正交后 IC 保留率 < 0.40"
    status_changed: "2026-11-26"
    status_reason: |
      第二批筛选：门 3（min t=8.56 / mac t=3.56）与门 4（保留 0.86 / 1.09）都过。
      但**门 5 失败**（两池各 20 只、无档位的构造）：V8 三因子 Sharpe -1.3814 →
      V8+168 -1.4940 → 权重×2 -1.5599，加得越重越差；
      置换重要性打乱 168 让 Sharpe 提升 0.148，纯噪声对照也优于 base。
      原因不是与 vol_ratio 冗余，而是**同向叠加**：两者都选"缩量"，加进去把组合推向更极端的冷门区
      （falsified #16 已证明该区域有毒）。降为 watch。
      若要在 N=50 的宽度构造上重测，属新立项。

